name: Gen IG and publish GH pages

on:
  workflow_dispatch:

env:
  IG_SHORTNAME: mal

jobs:
  publish:
    runs-on: ubuntu-latest
    container: hl7fhir/ig-publisher-base:latest
    steps:
      - uses: actions/checkout@v7
      - name: 🖥️ Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install 🔥 FHIR packages 🇳🇴
        run: |
          npm --registry https://packages.simplifier.net install hl7.fhir.r4.core@4.0.1
          curl -L -o hl7.fhir.no.basis-2.2.2-snapshots.tgz https://raw.githubusercontent.com/HL7Norway/resources/main/snapshots/hl7.fhir.no.basis-2.2.2-snapshots.tgz
          npm install hl7.fhir.no.basis-2.2.2-snapshots.tgz
          mkdir -p /github/home/.fhir/packages/hl7.fhir.no.basis#2.2.2/package
          cp -r ./node_modules/hl7.fhir.no.basis/* /github/home/.fhir/packages/hl7.fhir.no.basis#2.2.2/package

      - name: Run 🔥 IG Publisher with 🍣 Sushi
        run: |
          cd ${{ env.IG_SHORTNAME }}
          curl -L https://github.com/HL7/fhir-ig-publisher/releases/latest/download/publisher.jar -o ./input-cache/publisher.jar --create-dirs
          npm install -g fsh-sushi
          java -jar ./input-cache/publisher.jar publisher -ig ig.ini

      # Fjerner store ekstrafiler slik at GitHub Pages rekker å publisere innen 10 minutter.
      - name: ✂️ Fjern store filer før publisering
        run: |
          cd ${{ env.IG_SHORTNAME }}/output
          du -sh .
          rm -f *.zip *.db *.tgz *.ttl *.ttl.html *.xml.html *.json.html *.jsonld *.jsonld.html *.xlsx *.sch *.csv
          du -sh .

      - name: 🚀 Deploy to GitHub-Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ env.IG_SHORTNAME }}/output
          destination_dir: currentbuild
          commit_message: "Publiser IG"
